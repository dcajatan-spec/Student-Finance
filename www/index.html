<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Student Finance</title>
<meta name="theme-color" content="#0B1F18">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finance">
<style>
:root{--bg:#EDEBE3;--shell:#F6F5F1;--card:#F7F4EA;--page:radial-gradient(120% 70% at 0% 0%,#1D5240,#0B1F18 65%) fixed #0B1F18;--barbg:#E5E4D6;--barink:#3F4B3E;--barinkon:#14201A;--dangerbg:#F5D9D3;--danger:#B0402B;--line:#E7E4DA;--ink:#1C1B18;--mute:#6B6857;--hero:#1C1B18;--soft:#FAF9F5;--green:#3E7C5A;--red:#C0533B;--yellow:#FFCB05;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
body{display:flex;justify-content:center;padding:20px 12px;min-height:100%}
#root{width:100%;max-width:420px}
.shell{padding:.5rem .25rem 110px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-weight:600;font-size:15px}
.tag{font-size:10px;background:var(--yellow);color:#1C1B18;border-radius:6px;padding:2px 6px;font-weight:700}
.tabs{display:flex;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
.tabs button{flex:1;border:0;background:none;color:var(--mute);padding:8px;border-radius:9px;font-weight:600;font-size:13px;cursor:pointer}
.tabs button.on{background:var(--ink);color:var(--shell)}
.hero{background:var(--hero);color:#F6F5F1;border-radius:16px;padding:1.1rem 1.2rem;margin-bottom:12px}
.hero small{color:#B8B5A8;font-size:12px}
.big{font-size:28px;font-weight:700;letter-spacing:-.5px;margin:4px 0}
.neg{color:#E8A0A0}
.rate{display:flex;align-items:center;gap:8px;font-size:11px;color:#B8B5A8;margin-top:8px}
.rate input{flex:1;accent-color:#D0CBB4}
.rate b{color:#F6F5F1;min-width:34px;text-align:right}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem 1.1rem;margin-bottom:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ttl{font-size:14px;font-weight:600}
.mute{color:var(--mute);font-size:12px}
.link{cursor:pointer}
.mini{border-left:4px solid var(--yellow)}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:600;font-size:13px;cursor:pointer;background:var(--ink);color:var(--shell)}
.btn.y{background:var(--yellow);color:#1C1B18}
.btn.g{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.full{width:100%}
.in,.sel{border:1px solid var(--line);border-radius:8px;padding:7px 8px;font-size:13px;background:var(--card);color:var(--ink);min-width:0}
.form{display:flex;gap:6px;margin-top:10px}
.form .in{flex:1}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.item:last-child{border-bottom:0}
.item .l{min-width:0}
.item .l div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pos{color:var(--green);font-weight:600}.out{color:var(--red);font-weight:600}
.chips{display:flex;gap:6px;margin:10px 0}
.chip{border:1px solid var(--line);background:var(--soft);color:var(--mute);border-radius:999px;padding:4px 11px;font-size:12px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--shell);border-color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stat{background:var(--soft);border-radius:10px;padding:8px;text-align:center}
.stat b{display:block;font-size:13px}.stat span{font-size:10px;color:var(--mute)}
.momo-hero{background:#1C1B18;border-radius:16px;padding:1.1rem 1.2rem;margin-bottom:12px;color:#F6F5F1;border-top:4px solid var(--yellow)}
.momo-hero small{color:#B8B5A8;font-size:12px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
textarea.in{width:100%;min-height:64px;font-family:inherit;margin-top:8px}
.sim{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal .box{background:var(--card);border-radius:16px;padding:1.2rem;max-width:340px;width:100%}
.modal h3{margin:0 0 8px;font-size:17px}.modal p{font-size:13px;color:var(--mute);line-height:1.5;margin:6px 0}
.bad{background:var(--soft);border-radius:8px;padding:8px;font-size:11px;color:var(--mute);margin:6px 0;word-break:break-word}
.hi{font-size:17px;font-weight:700}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--soft);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--mute)}
.icons{display:flex;gap:8px;margin:0 0 12px}
.ib{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 4px;font-size:18px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.ib span{font-size:10px;color:var(--mute);font-weight:600}
.ib.on{border-color:var(--ink);background:var(--soft)}
.onb{min-height:420px;display:flex;align-items:center;justify-content:center;text-align:center}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin:10px 0;font-size:11px;color:var(--mute);font-weight:500}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.scroll{overflow-x:auto}
.err{color:#C0392B;font-size:11px;margin:4px 0 0;display:none}
.shell.onb{background:var(--card);border-radius:24px;padding:1rem}
.top .mute{color:#A9C2B5}.top .hi{color:#F6F5F1}
.ic{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px;margin-right:7px}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none;z-index:10}
.bar nav{pointer-events:auto;width:100%;max-width:396px;display:flex;background:var(--barbg);border-radius:22px;padding:10px 8px;box-shadow:0 6px 24px rgba(0,0,0,.4)}
.bar button{flex:1;border:0;background:none;color:var(--barink);opacity:.6;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:700;cursor:pointer;padding:4px}
.bar button.on{opacity:1;color:var(--barinkon)}
.bar svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:root[data-theme="dark"]{--shell:#0B1410;--card:#151D19;--line:#25312B;--ink:#EEF1EC;--mute:#9AA79F;--soft:#1C2621;--hero:#1F2D26;--page:radial-gradient(120% 70% at 0% 0%,#14291F,#070B09 65%) fixed #070B09;--barbg:#1A231E;--barink:#8FA096;--barinkon:#F2F5F0;--dangerbg:#3A201C;--danger:#F0A090;color-scheme:dark}
body{-webkit-font-smoothing:antialiased}
.big,.item span,.stat b,.ttl,.row b{font-variant-numeric:tabular-nums}
.card{border-radius:18px;box-shadow:0 1px 2px rgba(0,0,0,.08),0 10px 28px -14px rgba(0,0,0,.45)}
.btn{transition:transform .08s,opacity .15s}.btn:active{transform:scale(.97)}
:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
</style>
</head>
<body>
<div id="root"></div>
<script>
(function(){
"use strict";
var INC=["Allowance","Side hustle","Other"],EXP=["Academics","Food","Transport","Data & utilities"];
var S={tab:"home",name:null,theme:(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light",msg:"",er:false,focus:null,sav:10,inv:25,inc:[],exp:[],id:1,ask:false,filter:"all",
  m:{on:false,bal:0,sync:null,tx:[],bad:[]}};


function fmt(n){return "GHS "+(+n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}
function num(s){return parseFloat(String(s).replace(/,/g,""))}
function esc(s){var d=document.createElement("div");d.textContent=s==null?"":String(s);return d.innerHTML}
function opts(a,sel){return a.map(function(x){return '<option'+(x===sel?" selected":"")+'>'+esc(x)+"</option>"}).join("")}
function clock(d){return d?d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}):"never"}
function dstr(d){return d.toLocaleDateString([],{day:"numeric",month:"short"})}
function greet(){var h=new Date().getHours();return h<12?"Good morning":h<17?"Good afternoon":"Good evening"}
function initials(){return S.name.split(" ").map(function(p){return p[0]||""}).join("").slice(0,2).toUpperCase()}
function save(){try{localStorage.setItem("student-finance-v2",JSON.stringify({name:S.name,theme:S.theme,sav:S.sav,inv:S.inv,id:S.id,inc:S.inc,exp:S.exp,m:S.m}))}catch(e){}}
function migrateOld(){try{var r=localStorage.getItem("student-finance-app-state");if(!r){migrateOld();return}var d=JSON.parse(r);if(d.username)S.name=d.username;if(typeof d.savingsRate==="number")S.sav=d.savingsRate;if(typeof d.investRate==="number")S.inv=d.investRate;
 var IM={allowance:"Allowance",side_hustle:"Side hustle",other:"Other",academics:"Academics",food:"Food",transport:"Transport",data_utilities:"Data & utilities"};
 function mp(x){return{cat:IM[x.type]||x.type,amt:x.amount,note:x.note||"",date:x.date?new Date(x.date+"T12:00:00"):new Date()}}
 S.inc=(d.incomeEntries||[]).map(mp);S.exp=(d.expenseEntries||[]).map(mp)}catch(e){}}
function load(){try{var r=localStorage.getItem("student-finance-v2");if(!r){migrateOld();return}var d=JSON.parse(r);
 S.name=d.name||null;if(d.theme)S.theme=d.theme;S.sav=d.sav==null?10:d.sav;S.inv=d.inv==null?25:d.inv;S.id=d.id||1;
 S.inc=(d.inc||[]).map(function(x){x.date=new Date(x.date);return x});
 S.exp=(d.exp||[]).map(function(x){x.date=new Date(x.date);return x});
 if(d.m){S.m=d.m;S.m.bad=S.m.bad||[];S.m.tx=S.m.tx||[];S.m.sync=S.m.sync?new Date(S.m.sync):null;S.m.tx.forEach(function(t){t.date=new Date(t.date)})}
}catch(e){}}
function mkey(d){d=new Date(d);return d.getFullYear()+"-"+(d.getMonth()+1)}
function monthly(){
 var out=[],b=new Date();b.setDate(1);
 for(var i=5;i>=0;i--){var d=new Date(b.getFullYear(),b.getMonth()-i,1);out.push({k:mkey(d),l:d.toLocaleString(undefined,{month:"short"}),i:0,e:0})}
 function add(date,kind,amt){var k=mkey(date);out.forEach(function(o){if(o.k===k)o[kind]+=amt})}
 S.inc.forEach(function(x){add(x.date,"i",x.amt)});
 S.exp.forEach(function(x){add(x.date,"e",x.amt)});
 S.m.tx.forEach(function(t){if(t.cat){if(t.dir==="in")add(t.date,"i",t.amt);else add(t.date,"e",t.amt+t.fee)}});
 out.forEach(function(o){o.s=o.i*S.sav/100;o.v=o.i*S.inv/100;o.f=o.i-o.e-o.s-o.v});
 return out;
}
function chartPage(){
 var d=monthly(),mx=1;d.forEach(function(o){[o.i,o.e,o.s,Math.abs(o.f)].forEach(function(v){if(v>mx)mx=v})});
 var C=["#3E7C5A","#C0533B","#C9A227","#4A6FA5"],N=["Income","Expenses","Savings","Free to spend"],gw=60,bw=9,g=3,ch=120,W=gw*d.length;
 var svg=d.map(function(o,i){
  var vals=[o.i,o.e,o.s,o.f],gx=i*gw+(gw-(bw*4+g*3))/2;
  var bars=vals.map(function(v,j){var h=Math.max(2,Math.abs(v)/mx*ch);return '<rect x="'+(gx+j*(bw+g)).toFixed(1)+'" y="'+(ch-h).toFixed(1)+'" width="'+bw+'" height="'+h.toFixed(1)+'" rx="2" fill="'+C[j]+'"'+(v<0?' opacity=".5"':"")+'/>'}).join("");
  return '<g data-a="mon-'+o.k+'" style="cursor:pointer"><rect x="'+i*gw+'" y="0" width="'+gw+'" height="'+ch+'" rx="4" style="fill:'+(S.focus===o.k?"rgba(128,128,128,.18)":"transparent")+'"/>'+bars+'<text x="'+(i*gw+gw/2)+'" y="'+(ch+14)+'" text-anchor="middle" font-size="10" style="fill:var(--mute)">'+o.l+'</text></g>';
 }).join("");
 var legend='<div class="legend">'+N.map(function(n,j){return '<span><i style="background:'+C[j]+'"></i>'+n+'</span>'}).join("")+'</div>';
 var f=d.filter(function(o){return o.k===S.focus})[0],det='<p class="mute" style="margin:8px 0 0">Tap a month to see the breakdown.</p>';
 if(f)det='<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line)"><div class="ttl" style="margin-bottom:6px">'+f.l+'</div>'+[f.i,f.e,f.s,f.f].map(function(v,j){return '<div class="row mute" style="padding:3px 0"><span>'+N[j]+'</span><span>'+fmt(v)+'</span></div>'}).join("")+'</div>';
 return '<div class="card"><div class="ttl">Track data · last 6 months</div>'+legend+'<div class="scroll"><svg viewBox="0 0 '+W+' '+(ch+20)+'" width="'+W+'" height="'+(ch+20)+'">'+svg+'</svg></div>'+det+'</div>';
}
var IC={th:'<svg class="ic" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',user:'<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>',sl:'<svg class="ic" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>',sh:'<svg class="ic" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg>',ph:'<svg class="ic" viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/></svg>'};
function bar(){return '<div class="bar"><nav><button class="'+(S.tab==="chart"?"on":"")+'" data-a="tab-chart"><svg viewBox="0 0 24 24"><path d="M6 20V10M12 20V4M18 20v-7"/></svg>Track data</button><button class="'+(S.tab==="settings"?"on":"")+'" data-a="tab-settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Settings</button></nav></div>'}
function rateRow(lbl,key,max,line){return '<div class="row" style="margin-top:12px"><span style="font-weight:600;font-size:13px">'+lbl+'</span><b id="v-'+key+'">'+S[key]+'%</b></div><input type="range" min="0" max="'+max+'" value="'+S[key]+'" data-r="'+key+'" style="width:100%;accent-color:#3E7C5A;margin:6px 0 2px"><div class="mute">'+line+'</div>'}
function settings(){
 var t=totals(),m=S.m;
 var st=m.on?'<span class="dot" style="background:#3E9F6A"></span>Tracking on':'<span class="dot" style="background:#B0AD9F"></span>'+(m.tx.length?"Paused":"Off");
 var sub=m.on?"Balance "+fmt(m.bal)+" · updated "+clock(m.sync):(m.tx.length?"Tracking is off. Your saved transactions are kept.":"Turn on to import your MoMo messages.");
 var n=S.inc.length+" income and "+S.exp.length+" expense entries"+(m.tx.length?", plus "+m.tx.length+" MoMo transactions":"")+" saved on this phone.";
 return '<div class="card"><div class="ttl">'+IC.user+'Your name</div><input class="in" id="nm2" value="'+esc(S.name)+'" maxlength="30" style="width:100%;margin-top:10px;padding:11px"><p class="err" id="nm2e">Enter a name</p><button class="btn full" style="margin-top:10px;padding:13px" data-a="savename">Save name</button></div>'+
 '<div class="card"><div class="ttl">'+IC.sl+'Rates</div>'+rateRow("Savings rate","sav",50,"Fixed savings: "+fmt(t.sv))+rateRow("Invest rate","inv",100,"Amount to invest: "+fmt(t.iv))+'</div>'+
 '<div class="card"><div class="ttl">'+IC.th+'Appearance</div><div class="tabs" style="margin:10px 0 0"><button class="'+(S.theme==="light"?"on":"")+'" data-a="theme-light">Normal</button><button class="'+(S.theme==="dark"?"on":"")+'" data-a="theme-dark">Dark</button></div></div>'+
 '<div class="card"><div class="ttl">'+IC.ph+'MoMo</div><div style="margin-top:8px;font-size:13px;font-weight:600">'+st+'</div><p class="mute" style="margin:4px 0 0">'+sub+'</p>'+(m.on?'<button class="btn g full" style="margin-top:10px;padding:12px" data-a="off">Turn off MoMo tracking</button>':'<button class="btn y full" style="margin-top:10px;padding:12px" data-a="ask">'+(m.tx.length?"Turn MoMo tracking back on":"Turn on MoMo tracking")+'</button>')+'</div>'+
 '<div class="card"><div class="ttl">'+IC.sh+'Your data</div><p class="mute" style="margin:8px 0">'+n+'</p>'+(S.er?'<p class="mute" style="color:var(--danger);font-weight:600">This removes all entries and MoMo data. Tap again to confirm.</p><div class="form"><button class="btn g" style="flex:1" data-a="noerase">Cancel</button><button class="btn" style="flex:1;background:var(--danger);color:#fff" data-a="erase">Yes, erase</button></div>':'<button class="btn full" style="background:var(--dangerbg);color:var(--danger);padding:13px" data-a="erase">Erase all data</button>')+'</div>';
}
function page(){return S.tab==="home"?home():S.tab==="momo"?momo():S.tab==="chart"?chartPage():settings()}
function onboard(){
 document.getElementById("root").innerHTML='<div class="shell onb"><div><div style="font-size:30px">🐷</div><h1 style="font-size:20px;margin:6px 0 0">Welcome</h1><p class="mute" style="margin:4px 0 12px">What should we call you?</p><input class="in" id="nm" placeholder="Your name" maxlength="30" style="width:100%;text-align:center;padding:10px"><p class="err" id="nme">Enter a name to continue</p><button class="btn full" style="margin-top:12px" data-a="start">Get started</button></div></div>';
 document.getElementById("nm").focus();
}

function parse(t){
  var a=/GHS\s*([\d,]+\.?\d*)/i.exec(t),b=/Current Balance:\s*GHS\s*([\d,]+\.?\d*)/i.exec(t),fe=/Fee charged:\s*GHS\s*([\d,]+\.?\d*)/i.exec(t);
  var dir=/received/i.test(t)?"in":/Payment made|Cash Out|Airtime|Transfer/i.test(t)?"out":null;
  if(!a||!b||!dir)return null;
  var c=/(?:from|to)\s+([A-Z][A-Z .]+?)\.\s/.exec(t),r=/Reference:\s*([^.]+)\./i.exec(t);
  var kind=/Cash Out/i.test(t)?"Cash out":/Airtime/i.test(t)?"Airtime":dir==="in"?"Received":"Sent";
  return{dir:dir,amt:num(a[1]),bal:num(b[1]),fee:fe?num(fe[1]):0,who:c?c[1].trim():kind,kind:kind,ref:r?r[1].trim():"",cat:kind==="Airtime"?"Data & utilities":null};
}
function receive(text,date){
  var p=parse(text);S.m.sync=new Date();
  if(!p){S.m.bad.unshift({id:S.id++,raw:text});return false}
  var ti=/Transaction ID:\s*(\d+)/i.exec(text);p.tid=ti?ti[1]:null;if(p.tid&&S.m.tx.some(function(x){return x.tid===p.tid}))return "dup";
  var dm=/(\d{4})-(\d{2})-(\d{2})/.exec(text);p.id=S.id++;p.date=date||(dm?new Date(+dm[1],+dm[2]-1,+dm[3]):new Date());S.m.tx.unshift(p);S.m.bal=p.bal;return true;
}
function connect(){
  S.m.on=true;S.ask=false;
  
}
function totals(){
  var i=0,e=0,fees=0,mi=0,mo=0;
  S.inc.forEach(function(x){i+=x.amt});S.exp.forEach(function(x){e+=x.amt});
  S.m.tx.forEach(function(t){
    if(t.dir==="in")mi+=t.amt;else{mo+=t.amt;}fees+=t.fee;
    if(t.cat){if(t.dir==="in")i+=t.amt;else e+=t.amt+t.fee}
  });
  var sv=i*S.sav/100,iv=i*S.inv/100;
  return{inc:i,exp:e,sv:sv,iv:iv,free:i-e-sv-iv,fees:fees,mi:mi,mo:mo};
}

function home(){
  var t=totals(),pending=S.m.tx.filter(function(x){return !x.cat}).length;
  var h='<div class="hero"><small>Free to spend</small><div class="big'+(t.free<0?" neg":"")+'">'+fmt(t.free)+'</div><small>(Income − expenses) − savings − invest</small>'+
   
   '</div>';
  h+='<div class="card mini link" data-a="tab-momo"><div class="row"><div><div class="ttl">MoMo balance</div><div class="mute">'+(S.m.on?"Updated "+clock(S.m.sync)+(pending?" · "+pending+" to categorize":""):"Off · tap to set up")+'</div></div><div class="ttl">'+(S.m.on?fmt(S.m.bal):"—")+'</div></div></div>';
  h+='<div class="card"><div class="row"><span class="ttl">Income</span><span class="pos">'+fmt(t.inc)+'</span></div><div class="row" style="margin-top:6px"><span class="ttl">Expenses</span><span class="out">'+fmt(t.exp)+'</span></div><div class="mute" style="margin-top:6px">Includes categorized MoMo transactions. Balance is never added in.</div></div>';
  h+='<div class="card"><div class="ttl">Quick add</div><div class="form"><select class="sel" id="qk"><option value="inc">Income</option><option value="exp">Expense</option></select><select class="sel" id="qc">'+opts(INC)+'</select><input class="in" id="qa" type="number" placeholder="Amount" style="max-width:90px"><button class="btn" data-a="qadd">+</button></div></div>';
  var all=[];S.inc.forEach(function(x,i){all.push({k:"inc",i:i,x:x})});S.exp.forEach(function(x,i){all.push({k:"exp",i:i,x:x})});
  all.sort(function(a,b){return new Date(b.x.date)-new Date(a.x.date)});
  if(all.length){h+='<div class="card"><div class="ttl">Entries</div>'+all.map(function(o){return '<div class="item"><div class="l"><div>'+esc(o.x.cat)+(o.x.note?" · "+esc(o.x.note):"")+'</div><div class="mute">'+dstr(new Date(o.x.date))+'</div></div><span><span class="'+(o.k==="inc"?"pos":"out")+'">'+fmt(o.x.amt)+'</span> <a class="link mute" data-a="del-'+o.k+'-'+o.i+'" aria-label="Delete entry">✕</a></span></div>'}).join("")+'</div>'}
  return h;
}

function momo(){
  var m=S.m,t=totals(),h="";
  if(!m.on){
    return '<div class="momo-hero"><div class="big">MoMo wallet</div><small>Track your wallet balance and every MoMo transaction here. Paste your MoMo messages to import them.</small></div>'+
      '<div class="card"><p class="mute" style="margin-top:0">Everything stays on your phone. You can turn it off any time.</p><button class="btn y full" data-a="ask">Turn on MoMo tracking</button></div>';
  }
  h+='<div class="momo-hero"><small>Wallet balance</small><div class="big">'+fmt(m.bal)+'</div><small><span class="dot" style="background:#4ADE80"></span>Tracking on · updated '+clock(m.sync)+'</small></div>';
  h+='<div class="card"><div class="row"><span class="ttl">This month</span><button class="btn g" data-a="off">Turn off</button></div><div class="stats"><div class="stat"><b class="pos">'+fmt(t.mi)+'</b><span>Money in</span></div><div class="stat"><b class="out">'+fmt(t.mo)+'</b><span>Money out</span></div><div class="stat"><b>'+fmt(t.fees)+'</b><span>Fees paid</span></div></div></div>';
  var list=m.tx.filter(function(x){return S.filter==="all"||x.dir===S.filter});
  h+='<div class="card"><div class="ttl">Transactions</div><div class="chips">'+[["all","All"],["in","Received"],["out","Sent"]].map(function(c){return '<span class="chip'+(S.filter===c[0]?" on":"")+'" data-a="f-'+c[0]+'">'+c[1]+'</span>'}).join("")+'</div>';
  h+=list.length?list.map(function(x){
    var cats=x.dir==="in"?INC:EXP;
    return '<div class="item"><div class="l"><div><b>'+esc(x.who)+'</b></div><div class="mute">'+dstr(x.date)+' · '+esc(x.kind)+(x.fee?" · fee "+fmt(x.fee):"")+(x.ref?" · "+esc(x.ref):"")+'</div><select class="sel" data-tx="'+x.id+'" style="margin-top:4px;font-size:11px"><option value="">Choose category…</option>'+cats.map(function(c){return '<option'+(x.cat===c?" selected":"")+'>'+esc(c)+'</option>'}).join("")+'</select></div><span class="'+(x.dir==="in"?"pos":"out")+'">'+(x.dir==="in"?"+":"−")+fmt(x.amt)+'</span></div>';
  }).join(""):'<p class="mute">Nothing here yet.</p>';
  h+='</div>';
  if(m.bad.length){h+='<div class="card"><div class="ttl">Needs review ('+m.bad.length+')</div><p class="mute">Messages the parser couldn’t read. They don’t affect your budget.</p>'+m.bad.map(function(b){return '<div class="bad">'+esc(b.raw)+'<br><a class="link" style="color:var(--red)" data-a="dis-'+b.id+'">Dismiss</a></div>'}).join("")+'</div>'}
  h+='<div class="card"><div class="ttl">Import MoMo messages</div><p class="mute">Copy your MoMo SMS messages and paste them here, oldest first, so the balance ends on the latest one.</p><textarea class="in" id="paste" placeholder="Paste one or more MoMo messages…"></textarea><button class="btn full" style="margin-top:8px" data-a="paste">Import</button>'+(S.msg?'<p class="mute" style="margin:8px 0 0">'+esc(S.msg)+'</p>':'')+'<p class="mute" style="margin:8px 0 0">Automatic SMS reading comes with the Android app.</p></div>';
  return h;
}

function applyTheme(){document.documentElement.setAttribute("data-theme",S.theme);var m=document.querySelector("meta[name=theme-color]");if(m)m.setAttribute("content",S.theme==="dark"?"#070B09":"#0B1F18")}
function render(){
  applyTheme();
  if(!S.name){onboard();return}
  var h='<div class="shell"><div class="top"><div><div class="mute">'+greet()+'</div><div class="hi">'+esc(S.name)+'</div></div><div class="avatar">'+esc(initials())+'</div></div><div class="tabs"><button class="'+(S.tab==="home"?"on":"")+'" data-a="tab-home">Home</button><button class="'+(S.tab==="momo"?"on":"")+'" data-a="tab-momo">MoMo</button></div>'+page()+'</div>'+bar();
  if(S.ask)h+='<div class="modal"><div class="box"><h3>Turn on MoMo tracking?</h3><p>Paste your MTN MoMo messages to see your balance and transactions here. Automatic SMS reading arrives with the Android app.</p><p>Everything stays on your phone. You can turn it off any time.</p><div class="form"><button class="btn g" style="flex:1" data-a="deny">Not now</button><button class="btn y" style="flex:1" data-a="allow">Turn on</button></div></div></div>';
  document.getElementById("root").innerHTML=h;save();
}

var root=document.getElementById("root");
root.addEventListener("click",function(e){
  var b=e.target.closest("[data-a]");if(!b)return;
  var a=b.getAttribute("data-a");
  if(a.indexOf("tab-")===0)S.tab=a.slice(4);
  else if(a==="ask")S.ask=true;
  else if(a.indexOf("theme-")===0)S.theme=a.slice(6)==="dark"?"dark":"light";
  else if(a.indexOf("del-")===0){var q=a.split("-");S[q[1]].splice(+q[2],1)}
  else if(a==="start"||a==="savename"){var ni=document.getElementById(a==="start"?"nm":"nm2"),nv=ni.value.trim();if(!nv){document.getElementById(a==="start"?"nme":"nm2e").style.display="block";return}S.name=nv}
  else if(a.indexOf("mon-")===0){S.focus=S.focus===a.slice(4)?null:a.slice(4)}
  else if(a==="deny")S.ask=false;
  else if(a==="allow")connect();
  else if(a==="off"){S.m.on=false}
  else if(a==="erase"){if(!S.er){S.er=true}else{S.inc=[];S.exp=[];S.m={on:false,bal:0,sync:null,tx:[],bad:[]};S.er=false}}
  else if(a==="noerase")S.er=false;
  else if(a.indexOf("f-")===0)S.filter=a.slice(2);
  else if(a==="paste"){var v=document.getElementById("paste").value.trim();if(!v)return;var ok=0,dup=0,bad=0;v.split(/\n\s*\n|(?=You have received|Payment made for|Cash Out made|Airtime purchase|Transfer made)/i).forEach(function(c){c=c.trim();if(!c)return;var r=receive(c);if(r===true)ok++;else if(r==="dup")dup++;else bad++});S.msg="Imported "+ok+(dup?", "+dup+" already saved":"")+(bad?", "+bad+" could not be read":"")+"."}
  else if(a.indexOf("dis-")===0){var id=+a.slice(4);S.m.bad=S.m.bad.filter(function(x){return x.id!==id})}
  else if(a==="qadd"){
    var amt=parseFloat(document.getElementById("qa").value);if(!(amt>0))return;
    var k=document.getElementById("qk").value,c=document.getElementById("qc").value;
    S[k].push({cat:c,amt:amt,date:new Date()});
  }
  render();
});
root.addEventListener("change",function(e){
  var t=e.target;
  if(t.id==="qk"){document.getElementById("qc").innerHTML=opts(t.value==="inc"?INC:EXP);return}
  if(t.getAttribute("data-tx")){var id=+t.getAttribute("data-tx");S.m.tx.forEach(function(x){if(x.id===id)x.cat=t.value||null});render();return}
  if(t.getAttribute("data-r")){S[t.getAttribute("data-r")]=parseInt(t.value,10);render()}
});
root.addEventListener("input",function(e){
  var t=e.target;if(t.getAttribute("data-r")){var el=document.getElementById("v-"+t.getAttribute("data-r"));if(el)el.textContent=t.value+"%"}
});
root.addEventListener("keydown",function(e){if(e.key!=="Enter")return;var t=e.target;if(t.id==="nm"||t.id==="nm2"){var b=root.querySelector(t.id==="nm"?'[data-a="start"]':'[data-a="savename"]');if(b)b.click()}});
load();render();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
})();
</script>
</body>
</html>
